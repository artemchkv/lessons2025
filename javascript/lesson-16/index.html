<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>AJAX lesson</title>
</head>

<body>
  <h1>Author list</h1>
  <button class="fetch-list">Fetch Authors</button>
  <div id="root"></div>
  <form action="" id="add-author-form">
    <input type="text" name="name" placeholder="Author name" class="author-input">
    <input type="text" name="avatar" placeholder="Avatar URL" class="author-input">
    <button type="submit" class="add-author">Add Author</button>
  </form>
  <script src="index.js"></script>
</body>

</html>
